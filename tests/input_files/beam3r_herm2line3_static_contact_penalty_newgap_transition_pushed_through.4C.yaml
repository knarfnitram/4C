TITLE:
  - "Transition from large-angle to small-angle beam-to-beam contact with the new gap function
    (BEAMS_NEWGAP). In the first time step, beam 2 crosses beam 1 at 40 degree without contact, such
    that only the closest point gets a reference normal. In the second time step, beam 2 is rotated to
    10 degree and its ends are moved through beam 1, such that the Gauss points of the small-angle
    contact are deeply penetrated in the Newton iterates and have no reference normal of their own.
    The reference normal of the closest point of the pair has to be used for them, which must not
    abort the time step (DIVERCONT stop), and beam 2 has to end up on top of beam 1 (same result as
    with many small time steps)."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 1
  NUMSTEP: 2
  MAXTIME: 2
  DIVERCONT: "stop"
  RESTARTEVERY: 1
  TOLRES: 1e-08
  TOLDISP: 1e-08
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION/BEAM TO BEAM CONTACT:
  BEAMS_NEWGAP: true
  BEAMS_SEGCON: true
  BEAMS_BTBPENALTYPARAM: 1000
  BEAMS_BTBLINEPENALTYPARAM: 1000
  BEAMS_PERPSHIFTANGLE1: 20
  BEAMS_PERPSHIFTANGLE2: 30
  BEAMS_PARSHIFTANGLE1: 20
  BEAMS_PARSHIFTANGLE2: 30
  BEAMS_SEGANGLE: 2
  BEAMS_NUMINTEGRATIONINTERVAL: 10
