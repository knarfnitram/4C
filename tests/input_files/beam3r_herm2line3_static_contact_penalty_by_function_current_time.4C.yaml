TITLE:
  - "Beam-to-beam contact with the point penalty parameter defined by a function of time (BEAMS_BTBPENALTYPARAM_BY_FUNCT).
    Beam 2 crosses beam 1 with a small initial penetration. The penalty function is zero at the beginning
    of the (only) time step, therefore it has to be evaluated at the end of the time step. The result
    has to be identical to the one with the constant penalty parameter 1000."
