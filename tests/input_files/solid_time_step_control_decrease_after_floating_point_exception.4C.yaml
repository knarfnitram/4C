TITLE:
  - "Test case that tests that a floating point exception during the element evaluation triggers a"
  - "time-step reduction (requires FOUR_C_ENABLE_FE_TRAPPING to be meaningful):"
  - "  Two stacked hex8 elements, the top surface is pulled down by the height of one element."
  - "  Step 1: dt=1, the predictor (ConstDis) collapses the top element (zero volume)"
  - "     -> floating point exception (division by zero) in the material evaluation"
  - "     -> dt is reduced to 0.5*1=0.5 -> repeat step:"
  - "     -> Step 1: dt=0.5, converged."
  - "  Step 2: dt=0.5, converged."
  - "  Simulation ends at t=1.0, with dt=0.5"
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  PREDICT: "ConstDis"
  TIMESTEP: 1.0
  NUMSTEP: 10
  MAXTIME: 1.0
  TOLDISP: 1e-08
  TOLRES: 1e-08
  MAXITER: 20
  DIVERCONT: "adapt_step"
  LINEAR_SOLVER: 1
  time_step_control:
    decrease_factor: 0.5
STRUCT NOX/Printing:
  Outer Iteration: false
  Outer Iteration StatusTest: false
  Inner Iteration: false
SOLVER 1:
  SOLVER: "UMFPACK"
MATERIALS:
  - MAT: 1
    MAT_Struct_AAANeoHooke:
      YOUNG: 10
      NUE: 0.25
      BETA: 1
      DENS: 0.1
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
DESIGN SURF DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 3
    ONOFF: [1, 1, 1]
    VAL: [0, 0, 0]
    FUNCT: [0, 0, 0]
  - E: 2
    NUMDOF: 3
    ONOFF: [0, 0, 1]
    VAL: [0, 0, -1.0]
    FUNCT: [0, 0, 1]
DSURF-NODE TOPOLOGY:
  - "NODE 1 DSURFACE 1"
  - "NODE 2 DSURFACE 1"
  - "NODE 3 DSURFACE 1"
  - "NODE 4 DSURFACE 1"
  - "NODE 9 DSURFACE 2"
  - "NODE 10 DSURFACE 2"
  - "NODE 11 DSURFACE 2"
  - "NODE 12 DSURFACE 2"
NODE COORDS:
  - "NODE 1 COORD 0.0 0.0 0.0"
  - "NODE 2 COORD 1.0 0.0 0.0"
  - "NODE 3 COORD 1.0 1.0 0.0"
  - "NODE 4 COORD 0.0 1.0 0.0"
  - "NODE 5 COORD 0.0 0.0 1.0"
  - "NODE 6 COORD 1.0 0.0 1.0"
  - "NODE 7 COORD 1.0 1.0 1.0"
  - "NODE 8 COORD 0.0 1.0 1.0"
  - "NODE 9 COORD 0.0 0.0 2.0"
  - "NODE 10 COORD 1.0 0.0 2.0"
  - "NODE 11 COORD 1.0 1.0 2.0"
  - "NODE 12 COORD 0.0 1.0 2.0"
STRUCTURE ELEMENTS:
  - "1 SOLID HEX8 1 2 3 4 5 6 7 8 MAT 1 KINEM nonlinear"
  - "2 SOLID HEX8 5 6 7 8 9 10 11 12 MAT 1 KINEM nonlinear"
RESULT DESCRIPTION:
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "time_step_size"
      VALUE: 0.5
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "total_time"
      VALUE: 1.0
      TOLERANCE: 1e-14
  - STRUCTURE:
      SPECIAL: true
      QUANTITY: "total_num_steps"
      VALUE: 2
      TOLERANCE: 1e-14
