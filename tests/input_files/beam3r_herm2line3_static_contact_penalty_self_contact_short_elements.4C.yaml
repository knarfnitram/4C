TITLE:
  - "Single beam with beam-to-beam contact of the beam with itself. The elements are shorter than the
    beam diameter, such that elements i and i+2 are within contact distance, although the beam is straight.
    Element pairs of the same beam that are closer along the centerline than the minimal arc length for
    a physical self-contact must not be evaluated. The result has to be identical to the one without contact."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.5
  NUMSTEP: 2
  MAXTIME: 1
  TOLRES: 1e-08
  TOLDISP: 1e-08
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION/BEAM TO BEAM CONTACT:
  BEAMS_NEWGAP: true
  BEAMS_SEGCON: true
  BEAMS_BTBPENALTYPARAM: 1000
  BEAMS_BTBLINEPENALTYPARAM: 1000
  BEAMS_PERPSHIFTANGLE1: 20
  BEAMS_PERPSHIFTANGLE2: 30
  BEAMS_PARSHIFTANGLE1: 20
  BEAMS_PARSHIFTANGLE2: 30
  BEAMS_SEGANGLE: 2
  BEAMS_NUMINTEGRATIONINTERVAL: 10
