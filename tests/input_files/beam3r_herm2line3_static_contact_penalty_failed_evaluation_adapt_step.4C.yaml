    MAT_BeamReissnerElastHyper:
      YOUNG: 100000
      POISSONRATIO: 0.3
      DENS: 0
      CROSSAREA: 0.007853981633974483
      SHEARCORR: 1
      MOMINPOL: 9.817477042468104e-06
      MOMIN2: 4.908738521234052e-06
      MOMIN3: 4.908738521234052e-06
FUNCT1:
  - SYMBOLIC_FUNCTION_OF_SPACE_TIME: "t"
RESULT DESCRIPTION:
