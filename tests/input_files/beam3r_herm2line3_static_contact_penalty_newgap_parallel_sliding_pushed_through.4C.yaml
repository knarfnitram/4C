TITLE:
  - "Small-angle beam-to-beam contact of two parallel beams with short elements and the new gap function
    (BEAMS_NEWGAP). In the first time step, beam 2 is moved slightly onto beam 1 without contact. In the
    second time step, beam 2 is moved along beam 1 by two of its element lengths and its ends are moved
    through beam 1, such that the Gauss points are deeply penetrated in the Newton iterates and project
    onto elements of beam 2 that were not in contact with them in the last accepted configuration. The
    reference for the sign of the gap has to be determined from the accepted configuration, which must
    not abort the time step (DIVERCONT stop), and beam 2 has to end up on top of beam 1 (same result as
    with many small time steps)."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 1
  NUMSTEP: 2
  MAXTIME: 2
  DIVERCONT: "stop"
  TOLRES: 1e-08
  TOLDISP: 1e-08
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION/BEAM TO BEAM CONTACT:
  BEAMS_NEWGAP: true
  BEAMS_SEGCON: true
  BEAMS_BTBPENALTYPARAM: 1000
  BEAMS_BTBLINEPENALTYPARAM: 1000
  BEAMS_PERPSHIFTANGLE1: 20
  BEAMS_PERPSHIFTANGLE2: 30
  BEAMS_PARSHIFTANGLE1: 20
  BEAMS_PARSHIFTANGLE2: 30
  BEAMS_SEGANGLE: 2
  BEAMS_NUMINTEGRATIONINTERVAL: 10
BEAM INTERACTION/BEAM TO BEAM CONTACT CONDITIONS:
