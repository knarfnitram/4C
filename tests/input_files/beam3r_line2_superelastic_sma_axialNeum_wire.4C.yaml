TITLE:
  - "Superelastic SMA beam material test"
  - "Axial force cycle of a thin wire (CROSSAREA != 1): the volume-specific SMA parameters are scaled
    with the area, so the strains equal those of the test with unit area. Fibre model active, but not
    loaded."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
DISCRETISATION:
  NUMFLUIDDIS: 0
  NUMALEDIS: 0
  NUMTHERMDIS: 0
IO/RUNTIME VTK OUTPUT:
  INTERVAL_STEPS: 1
IO/RUNTIME VTK OUTPUT/BEAMS:
  OUTPUT_BEAMS: true
  DISPLACEMENT: true
  STRAINS_GAUSSPOINT: true
  MATERIAL_FORCES_GAUSSPOINT: true
STRUCTURAL DYNAMIC:
  RESTARTEVERY: 5
  DYNAMICTYPE: "Statics"
  TIMESTEP: 0.04
  NUMSTEP: 50
  MAXTIME: 2
  PREDICT: "TangDis"
  TOLRES: 1e-08
  TOLDISP: 1e-08
  MAXITER: 20
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
DESIGN POINT DIRICH CONDITIONS:
  - E: 1
    NUMDOF: 6
    ONOFF: [1, 1, 1, 1, 1, 1]
    VAL: [0, 0, 0, 0, 0, 0]
    FUNCT: [0, 0, 0, 0, 0, 0]
