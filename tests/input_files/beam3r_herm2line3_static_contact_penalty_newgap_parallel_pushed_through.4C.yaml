TITLE:
  - "Small-angle beam-to-beam contact of two parallel beams with the new gap function (BEAMS_NEWGAP).
    In the first time step, beam 2 is moved slightly onto beam 1, such that the Gauss points of the
    small-angle contact get a reference normal. In the second time step, the ends of beam 2 are moved
    through beam 1, such that the Newton iterates have a deep penetration. Since the sign of the gap is
    tracked with the reference normals, this must not abort the time step (DIVERCONT stop), and beam 2
    has to end up on top of beam 1 (same result as in the test with many smaller time steps,
    beam3r_herm2line3_static_contact_penalty_newgap_parallel_penetration)."
PROBLEM TYPE:
  PROBLEMTYPE: "Structure"
STRUCTURAL DYNAMIC:
  DYNAMICTYPE: "Statics"
  TIMESTEP: 1
  NUMSTEP: 2
  MAXTIME: 2
  DIVERCONT: "stop"
  TOLRES: 1e-08
  TOLDISP: 1e-08
  PREDICT: "TangDis"
  LINEAR_SOLVER: 1
SOLVER 1:
  SOLVER: "UMFPACK"
  NAME: "Structure_Solver"
BEAM INTERACTION/BEAM TO BEAM CONTACT:
  BEAMS_NEWGAP: true
  BEAMS_SEGCON: true
  BEAMS_BTBPENALTYPARAM: 1000
  BEAMS_BTBLINEPENALTYPARAM: 1000
  BEAMS_PERPSHIFTANGLE1: 20
  BEAMS_PERPSHIFTANGLE2: 30
  BEAMS_PARSHIFTANGLE1: 20
  BEAMS_PARSHIFTANGLE2: 30
  BEAMS_SEGANGLE: 2
  BEAMS_NUMINTEGRATIONINTERVAL: 10
BEAM INTERACTION/BEAM TO BEAM CONTACT CONDITIONS:
  - E: 1
    COUPLING_ID: 1
  - E: 2
    COUPLING_ID: 1
BINNING STRATEGY:
  BIN_SIZE_LOWER_BOUND: 0.5
  DOMAINBOUNDINGBOX: "-1.0 -1.0 -0.5 2.0 1.0 0.5"
DESIGN POINT DIRICH CONDITIONS:
